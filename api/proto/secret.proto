// Package passwordkeeper defines the gRPC API for the PasswordKeeper password manager.
syntax = "proto3";

package passwordkeeper.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kvsuharev/passwordkeeper/api/gen;passwordkeeperv1";

// SecretType enumerates supported secret kinds.
enum SecretType {
  SECRET_TYPE_UNSPECIFIED = 0;
  SECRET_TYPE_CREDENTIALS = 1;
  SECRET_TYPE_TEXT        = 2;
  SECRET_TYPE_BINARY      = 3;
  SECRET_TYPE_CARD        = 4;
  SECRET_TYPE_OTP         = 5;
}

// SecretMeta contains server-side metadata for a secret (no payload).
message SecretMeta {
  // id is the client-generated UUID of the secret.
  string id = 1;
  // type is the kind of secret.
  SecretType type = 2;
  // name is the human-readable label for the secret.
  string name = 3;
  // version is the monotonically increasing server-side version number.
  int64 version = 4;
  // deleted indicates the secret was soft-deleted.
  bool deleted = 5;
  // updated_at is the timestamp of the last server-side change.
  google.protobuf.Timestamp updated_at = 6;
}

// Secret is SecretMeta plus the encrypted payload (nonce + ciphertext).
message Secret {
  // meta contains identity and versioning information.
  SecretMeta meta = 1;
  // payload is nonce || AES-256-GCM ciphertext encrypted on the client.
  bytes payload = 2;
}

// CreateSecretRequest asks the server to store a new secret.
message CreateSecretRequest {
  // id is the client-generated UUID; must be globally unique.
  string id = 1;
  // type is the kind of secret.
  SecretType type = 2;
  // name is the human-readable label.
  string name = 3;
  // payload is the encrypted content.
  bytes payload = 4;
}

// GetSecretRequest identifies a secret to retrieve.
message GetSecretRequest {
  // id is the UUID of the secret to fetch.
  string id = 1;
}

// UpdateSecretRequest replaces the payload of an existing secret.
message UpdateSecretRequest {
  // id identifies the secret to update.
  string id = 1;
  // name is the new human-readable label.
  string name = 2;
  // payload is the new encrypted content.
  bytes payload = 3;
  // base_version is the version the client last saw; used for OCC.
  int64 base_version = 4;
}

// DeleteSecretRequest soft-deletes a secret.
message DeleteSecretRequest {
  // id identifies the secret to delete.
  string id = 1;
  // base_version is the version the client last saw; used for OCC.
  int64 base_version = 2;
}

// UploadChunk is one frame in the client-streaming binary upload RPC.
message UploadChunk {
  oneof data {
    // meta is sent as the first frame with create parameters.
    CreateSecretRequest meta = 1;
    // chunk is subsequent raw data bytes (up to 64 KiB each).
    bytes chunk = 2;
  }
}

// DownloadRequest identifies a binary secret to download.
message DownloadRequest {
  // id is the UUID of the binary secret.
  string id = 1;
}

// DownloadChunk is one frame in the server-streaming binary download RPC.
message DownloadChunk {
  oneof data {
    // meta is the first frame with identity and version information.
    SecretMeta meta = 1;
    // chunk is subsequent raw payload bytes (up to 64 KiB each).
    bytes chunk = 2;
  }
}

// SecretService manages the full lifecycle of secrets.
service SecretService {
  // Create stores a new encrypted secret.
  rpc Create(CreateSecretRequest) returns (SecretMeta);
  // Get returns a single secret including its encrypted payload.
  rpc Get(GetSecretRequest) returns (Secret);
  // Update replaces the payload of an existing secret using optimistic concurrency.
  rpc Update(UpdateSecretRequest) returns (SecretMeta);
  // Delete soft-deletes a secret using optimistic concurrency.
  rpc Delete(DeleteSecretRequest) returns (SecretMeta);
  // Upload streams a large binary secret to the server in 64-KiB chunks.
  rpc Upload(stream UploadChunk) returns (SecretMeta);
  // Download streams a binary secret's payload from the server in 64-KiB chunks.
  rpc Download(DownloadRequest) returns (stream DownloadChunk);
}
